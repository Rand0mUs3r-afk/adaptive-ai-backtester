name: Options backtest - EOD quotes ($2,000)
on:
  workflow_dispatch:
    inputs:
      start:
        description: Historical start YYYY-MM-DD
        type: string
        required: true
      end:
        description: Completed end YYYY-MM-DD (max 180 calendar days)
        type: string
        required: true
      allocation:
        description: Shared-equity premium allocation fraction
        type: string
        default: '0.25'
permissions:
  contents: read
jobs:
  watchlist-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Automatically select feed and backtest watchlist
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          ALLOCATION: ${{ inputs.allocation }}
        run: python auto_watchlist.py --start "$START" --end "$END" --allocation "$ALLOCATION"
      - name: Publish outcomes
        if: always()
        run: |
          if [ -f results/report.md ]; then
            cat results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No valid report; inspect failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchlist-options-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 7

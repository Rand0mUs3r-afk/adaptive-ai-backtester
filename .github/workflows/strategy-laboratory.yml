name: Batch strategy laboratory - one run
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 5 = first five ticker candidates; requested = watchlist union; full includes S&P 500. All use five shortlisted setups at 10%.
        type: choice
        options:
          - '5'
          - requested
          - full
        default: requested
      start:
        description: Development start YYYY-MM-DD
        type: string
        default: '2026-08-03'
        required: true
      split:
        description: Validation start YYYY-MM-DD
        type: string
        default: '2026-10-01'
        required: true
      end:
        description: Validation end YYYY-MM-DD; total span max 180 days
        type: string
        default: '2026-10-30'
        required: true
permissions:
  contents: read
concurrency:
  group: strategy-laboratory
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - id: plan
        name: Prepare five-setup shortlist and selected ticker scope
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCOPE: ${{ inputs.scope }}
          START: ${{ inputs.start }}
          SPLIT: ${{ inputs.split }}
          END: ${{ inputs.end }}
        run: python -u shortlist_research.py --prepare --scope "$SCOPE" --start "$START" --split "$SPLIT" --end "$END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-universe-${{ github.run_id }}
          path: universe.json
          retention-days: 7
          if-no-files-found: warn
  experiments:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: research-universe-${{ github.run_id }}
          path: .
      - uses: actions/cache/restore@v4
        id: quote-cache
        continue-on-error: true
        with:
          path: quote_cache/
          key: q-v1-${{ hashFiles('limited_backtest.py', 'onclick_backtest.py', 'research_repairs.py') }}-${{ matrix.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            q-v1-${{ hashFiles('limited_backtest.py', 'onclick_backtest.py', 'research_repairs.py') }}-${{ matrix.batch }}-
      - name: Run five shortlisted setups at 10% with cache and diagnostics
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BATCH: ${{ matrix.batch }}
        run: python -u shortlist_research.py --batch "$BATCH"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.quote-cache.outcome == 'success' }}
        continue-on-error: true
        with:
          path: quote_cache/
          key: q-v1-${{ hashFiles('limited_backtest.py', 'onclick_backtest.py', 'research_repairs.py') }}-${{ matrix.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-batch-${{ matrix.batch }}-${{ github.run_id }}
          path: suite_results/
          retention-days: 7
          if-no-files-found: warn
  combine:
    needs: [plan, experiments]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: research-universe-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: universe-batch-*-${{ github.run_id }}
          path: suite_inputs/
          merge-multiple: true
      - run: python -u shortlist_research.py --merge suite_inputs/
      - name: Publish shortlist, diagnostics and final equity/trade table
        if: always()
        run: |
          if [ -f suite_final/report.md ]; then
            cat suite_final/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-lab-final-${{ github.run_id }}
          path: suite_final/
          retention-days: 7
          if-no-files-found: warn

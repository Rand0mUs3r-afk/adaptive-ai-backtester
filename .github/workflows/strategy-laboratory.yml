name: Batch strategy laboratory - one run
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Requested = explicit tickers plus existing watchlist; Full also includes S&P 500 and can take hours/days
        type: choice
        options:
          - requested
          - full
        default: requested
      start:
        description: Development start YYYY-MM-DD
        type: string
        default: '2026-08-03'
        required: true
      split:
        description: Validation start YYYY-MM-DD
        type: string
        default: '2026-10-01'
        required: true
      end:
        description: Validation end YYYY-MM-DD; total span max 180 days
        type: string
        default: '2026-10-30'
        required: true
permissions:
  contents: read
concurrency:
  group: strategy-laboratory
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - id: plan
        name: Prepare explicitly selected scope and display simulation count
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCOPE: ${{ inputs.scope }}
          START: ${{ inputs.start }}
          SPLIT: ${{ inputs.split }}
          END: ${{ inputs.end }}
        run: python -u research_progress.py --prepare --scope "$SCOPE" --start "$START" --split "$SPLIT" --end "$END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-universe-${{ github.run_id }}
          path: universe.json
          retention-days: 7
          if-no-files-found: warn
  experiments:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: research-universe-${{ github.run_id }}
          path: .
      - name: Show live per-symbol and per-simulation progress
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BATCH: ${{ matrix.batch }}
        run: python -u research_progress.py --batch "$BATCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-batch-${{ matrix.batch }}-${{ github.run_id }}
          path: suite_results/
          retention-days: 7
          if-no-files-found: warn
  combine:
    needs: [plan, experiments]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: research-universe-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: universe-batch-*-${{ github.run_id }}
          path: suite_inputs/
          merge-multiple: true
      - run: python expanded_universe.py --merge suite_inputs/
      - name: Publish report including final equity/trade table
        if: always()
        run: |
          if [ -f suite_final/report.md ]; then
            cat suite_final/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-lab-final-${{ github.run_id }}
          path: suite_final/
          retention-days: 7
          if-no-files-found: warn
